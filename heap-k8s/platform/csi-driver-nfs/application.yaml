apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
      chart: csi-driver-nfs
      targetRevision: 4.13.6
      helm:
        releaseName: csi-driver-nfs
        valueFiles:
          - $values/platform/csi-driver-nfs/values.yaml
    - repoURL: ${LAB_GIT_URL}
      targetRevision: main
      ref: values
    # The heap-nfs StorageClass.
    - repoURL: ${LAB_GIT_URL}
      targetRevision: main
      path: platform/csi-driver-nfs/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
