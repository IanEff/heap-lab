# Argo CD managing itself. bootstrap.sh installs this same chart and values
# once by hand; after that, changes here are how Argo CD gets upgraded.
#
# Manual sync and no resources-finalizer: a bad commit here shouldn't be able to
# break or delete Argo CD without someone pressing sync and watching.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.0 # Argo CD v3.6.1
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: ${LAB_GIT_URL}
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      # Argo CD's CRDs are too big for client-side apply's annotation.
      - ServerSideApply=true
