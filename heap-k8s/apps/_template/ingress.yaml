# Publishes the app at https://<name>.recurse.cloud. Ask in the #heap community cluster stream for a DNS
# record first: until the migration ends, *.recurse.cloud points at the old
# cluster, so each app on the new one needs its own A record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: cilium
  rules:
    - host: CHANGEME.recurse.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  name: http
  tls:
    - hosts:
        - CHANGEME.recurse.cloud
      secretName: hello-tls
