---
# Connection: scripts/ssh_config.sh writes .state/ssh_config from Lima's own.
ansible_ssh_common_args: "-F {{ lookup('env', 'LAB_ROOT') }}/.state/ssh_config"

# What cluster-config's inventory/hosts sets in [all:vars].
extra_path_dirs: ""
ld_library_path_dirs: ""

lab_domain: "{{ lookup('env', 'LAB_DOMAIN') }}"
lab_subnet: "{{ lookup('env', 'LAB_SUBNET_PREFIX') }}.0/24"
lab_subnet_v6: "{{ lookup('env', 'LAB_IPV6_PREFIX') }}::/64"
