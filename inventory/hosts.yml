# The lab's inventory, shaped like cluster-config's inventory/hosts so the
# same playbooks run unchanged. Names are <node>.heap-lab: the short name is
# the Heap node name, and the domain resolves nowhere but .state/ssh_config.
all:
  children:
    # ── new cluster, as cluster-config's inventory/hosts has it ──
    k3s_cluster:
      children:
        k3s_init:
          hosts:
            greene.heap-lab:
        k3s_servers:
          hosts:
            greene.heap-lab:
            crosby.heap-lab:
        k3s_agents:
          hosts:
            broome.heap-lab:

    # ── old stage only (playbooks/old.yml) ──
    old_server:
      hosts:
        broome.heap-lab:
    old_agents:
      hosts:
        greene.heap-lab:
    experiment:
      hosts:
        crosby.heap-lab:

    # cluster-config's `cluster` group (configure.yml's second play).
    # Deliberately no `gpu` group: the role would set default-runtime: nvidia
    # and no lab node has the runtime. See README, "What isn't true to Heap".
    cluster:
      hosts:
        greene.heap-lab:
        crosby.heap-lab:
        broome.heap-lab:
