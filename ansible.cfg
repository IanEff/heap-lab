# Used for every playbook the lab runs, cluster-config's included
# (scripts/play.sh sets ANSIBLE_CONFIG). cluster-config's own ansible.cfg
# points at .vault-pass and the real inventory; neither is wanted here.
[defaults]
inventory = ./inventory
collections_path = ./.cache/collections
display_skipped_hosts = no
callbacks_enabled = profile_tasks
host_key_checking = False
interpreter_python = auto_silent
forks = 10
# prometheus.prometheus 0.27.0 says ansible-core <= 2.18; see scripts/setup.sh.
collections_on_ansible_version_mismatch = ignore

[ssh_connection]
pipelining = true
