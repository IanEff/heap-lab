# mercer, the lab's optional fourth node (LAB_MERCER=1). scripts/play.sh adds
# this file to the inventory only then, so the three-node lab never sees it.
# The groups are cluster-config's (mercer is a k3s agent there) and the old
# stage's (an old agent beside greene).
all:
  children:
    k3s_cluster:
      children:
        k3s_agents:
          hosts:
            mercer.heap-lab:
    old_agents:
      hosts:
        mercer.heap-lab:
    cluster:
      hosts:
        mercer.heap-lab:
